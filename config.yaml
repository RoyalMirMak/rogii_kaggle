# config.yaml

paths:
  # Local path. The code will automatically switch to Kaggle paths if it detects them.
  data_dir: "./data"
  artifacts_dir: .artifacts_pfz_gr
  sample_submission_file: "sample_submission.csv"  # Input template from Kaggle
  submission_file: submission_pfz_gr.csv
  competition_name: "rogii-wellbore-geology-prediction"

dry_run:
  enabled: false
  sample_train_wells: 10
  sample_test_wells: 2
  max_rows_per_well: 500

training:
  seed: 42
  n_folds: 5
  n_jobs: 15  # Sequential processing to avoid multiprocessing deadlock

model:
  name: "lightgbm"
  num_boost_round: 3000
  early_stopping_rounds: 150
  params:
    objective: "regression"
    metric: "rmse"
    learning_rate: 0.03
    num_leaves: 127
    min_data_in_leaf: 50
    feature_fraction: 0.75
    bagging_fraction: 0.8
    bagging_freq: 5
    lambda_l2: 1.0
    verbose: -1
    seed: 42
    device_type: "gpu"
    gpu_platform_id: 0
    gpu_device_id: 0

physics:
  # Formation Plane KNN configuration
  plane_knn_k: 10
  formations: ["ANCC", "ASTNU", "ASTNL", "EGFDU", "EGFDL", "BUDA"]
  pf_z:
    particles: 600
    momentum: 0.993
    velocity_noise: 0.004
    position_noise: 0.008
    init_position_std: 0.50
    init_velocity_std: 0.015
    gr_smooth_window: 5
    smooth_gr_weight: 0.30
  
  # Beam search configurations: (beam_size, move_cost, emit_scale, smooth_radius, tag)
  beams:
    - [10, 20.0, 144.0, 2, "cons"]
    - [10, 8.0, 64.0, 2, "loose"]
    - [8, 35.0, 220.0, 1, "vcons"]
    - [10, 14.0, 90.0, 5, "sm5"]
    - [20, 4.0, 36.0, 3, "vloose"]
    - [12, 12.0, 100.0, 3, "med1"]
    - [15, 25.0, 180.0, 2, "wide1"]
    - [20, 30.0, 200.0, 2, "wide2"]
    - [15, 10.0, 80.0, 4, "med2"]
    - [25, 6.0, 50.0, 3, "vloose2"]
    - [10, 40.0, 300.0, 1, "vwide1"]
    - [12, 18.0, 120.0, 5, "med3"]
    - [30, 8.0, 70.0, 2, "vloose3"]
    - [10, 50.0, 400.0, 0, "vwide2"]

features:
  enable_pfz: true
  enable_gr_sequence: true
  enable_per_formation_tvt: true
  enable_beam_disagreement: true
  enable_hidden_gr_summary: true
  enable_local_velocity: true