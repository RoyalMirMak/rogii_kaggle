# config.yaml

paths:
  # Local path. The code will automatically switch to Kaggle paths if it detects them.
  data_dir: "./data"
  artifacts_dir: "./artifacts"
  sample_submission_file: "sample_submission.csv"  # Input template from Kaggle
  submission_file: "submission.csv"                # Output file for predictions
  competition_name: "rogii-wellbore-geology-prediction"

training:
  seed: 42
  n_folds: 5
  n_jobs: 15  # Sequential processing to avoid multiprocessing deadlock

model:
  name: "lightgbm"
  num_boost_round: 2000
  early_stopping_rounds: 100
  params:
    objective: "regression"
    metric: "rmse"
    learning_rate: 0.03
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 5
    lambda_l2: 1.0
    verbose: -1
    seed: 42
    device_type: "gpu"
    gpu_platform_id: 0
    gpu_device_id: 0

physics:
  # Formation Plane KNN configuration
  plane_knn_k: 10
  formations: ["ANCC", "ASTNU", "ASTNL", "EGFDU", "EGFDL", "BUDA"]
  
  # Beam search configurations: (beam_size, move_cost, emit_scale, smooth_radius, tag)
  beams:
    - [10, 20.0, 144.0, 2, "cons"]
    - [10, 8.0, 64.0, 2, "loose"]
    - [8, 35.0, 220.0, 1, "vcons"]
    - [10, 14.0, 90.0, 5, "sm5"]
    - [20, 4.0, 36.0, 3, "vloose"]
